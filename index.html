<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiftTraders - KQBinary</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0a1222;color:#fff}.hdr{background:#101d36;display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #1e3258;position:sticky;top:0;z-index:10}.logo{display:flex;gap:8px;font-weight:900;font-size:18px;align-items:center}.logo b{background:#0a84ff;padding:4px 9px;border-radius:9px}.bal{background:#15264a;border:1px solid #21407a;border-radius:22px;padding:7px 12px;font-weight:900}.dep{background:#0a84ff;border:0;color:#fff;padding:8px 16px;border-radius:10px;font-weight:900}.tabs{display:flex;gap:18px;padding:12px 14px;border-bottom:1px solid #162748}.tabs button{background:none;border:0;color:#5a7296;font-weight:800;padding-bottom:10px;border-bottom:3px solid transparent}.tabs.on{color:#2a8cff;border-bottom-color:#2a8cff}.main{padding:10px}.card{background:#13213b;border:1px solid #1d325a;border-radius:18px;padding:12px}.price{font-size:30px;font-weight:900;color:#ff4a5a}.chartWrap{background:#080e1c;border-radius:12px;margin:10px 0;height:280px;border:1px solid #1a2c4f}canvas{width:100%;height:100%}.stats{display:flex;gap:6px;margin:8px 0}.stats span{font-size:11px;font-weight:900;padding:5px 9px;border-radius:7px}.hot{background:linear-gradient(90deg,#ff7b1a,#ff3d00);color:#fff}.cold{background:#14305e;color:#7fb1ff}.last{background:#2b344b;color:#cbd5ea}.bar{height:7px;background:#1f2f4f;border-radius:10px;overflow:hidden}.bar b{display:block;height:100%;width:53%;background:#0a84ff}.modes{display:flex;gap:10px;margin:12px 0}.modes button{flex:1;padding:13px;border-radius:12px;border:1px solid #2a4064;background:#162544;color:#6c86a8;font-weight:900}.modes.act{background:#0a84ff;border-color:#0a84ff;color:#fff}.stakeBox{display:flex;gap:14px;align-items:center;background:#0a162c;border:1px solid #1e365f;border-radius:30px;padding:5px 10px}.stakeBox button{width:30px;height:30px;border-radius:50%;border:0;background:#2b3c5a;color:#fff;font-weight:900}.chips{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:7px}.chips button{padding:9px 0;border-radius:20px;border:1px solid #274060;background:#0f1e36;color:#7b94b8;font-weight:900}.chips.onChip2{background:#0a84ff;color:#fff;border-color:#0a84ff}.buyBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.buyBtns button{padding:14px;border-radius:12px;border:0;font-weight:900}.buyEven{background:#0a84ff;color:#fff}.buyOdd{background:#1a2f56;color:#7fb1ff;border:1px solid #2a4a7a!important}.log{margin-top:10px;background:#0a1222;border-radius:12px;padding:8px;font-size:11px;max-height:110px;overflow:auto;border:1px solid #1a2d4f}</style></head><body><div class="hdr"><div class="logo"><b>RT</b>RiftTraders</div><div><span class="bal" id="bal">R $ 0.00</span> <button class="dep">Deposit</button></div></div><div class="tabs"><button>Matches/Differs</button><button class="on">Even/Odd</button><button>Over/Under</button></div><div class="main"><div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:800">Volatility 10 (1s) Index</div><div class="price" id="price">9450.48</div><div style="color:#ff4a5a;font-size:12px">▼ -0.01 (-0.01%)</div></div><span style="background:#1a315f;color:#5fa2ff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:900;height:fit-content" id="badge">LAST 8</span></div><div class="chartWrap"><canvas id="c"></canvas></div><div class="stats"><span class="hot" id="hot">HOT 8</span><span class="cold" id="cold">COLD 9</span><span class="last" id="last">LAST 8</span></div><div style="display:flex;justify-content:space-between;font-weight:900;margin:10px 0 6px"><span style="color:#2a8cff" id="evenPct">EVEN 53%</span><span style="color:#5a7296" id="oddPct">47% ODD</span></div><div class="bar"><b id="bar"></b></div><div class="modes"><button class="act" id="autoBtn" onclick="setMode('auto')">AUTO</button><button id="manBtn" onclick="setMode('manual')">MANUAL</button></div><div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span style="color:#6c86a8;font-size:11px;font-weight:800">STAKE</span><div class="stakeBox"><button onclick="chgStake(-1)">−</button><span id="stakeVal" style="font-weight:900;font-size:19px;min-width:50px;text-align:center">$10</span><button onclick="chgStake(1)">+</button></div><span></span></div><div class="chips"><button onclick="setStake(1)">$1</button><button onclick="setStake(5)">$5</button><button class="onChip2" onclick="setStake(10)">$10</button><button onclick="setStake(25)">$25</button><button onclick="setStake(50)">$50</button><button class="onChip2" onclick="setStake(100)" style="grid-column:span 2">$100</button></div><div class="buyBtns"><button class="buyEven" onclick="trade('even')">BUY EVEN</button><button class="buyOdd" onclick="trade('odd')">BUY ODD</button></div><div style="margin-top:12px;background:#0e1e38;border:1.5px solid #0a84ff;border-radius:12px;padding:12px;display:flex;justify-content:space-between"><span style="color:#6c86a8;font-size:11px">◎ TARGET</span><b>$200</b></div><div class="log" id="log"><div>Bot ready - KQBinary style. Click AUTO.</div></div></div></div><script>let balance=0,stake=10,price=9450.48,lastDigit=8,history=[],evenCount=0,total=0,autoRunning=false,autoTimer=null,points=[];const balEl=document.getElementById('bal'),priceEl=document.getElementById('price'),badge=document.getElementById('badge'),lastEl=document.getElementById('last'),hotEl=document.getElementById('hot'),coldEl=document.getElementById('cold'),evenPctEl=document.getElementById('evenPct'),oddPctEl=document.getElementById('oddPct'),barEl=document.getElementById('bar'),logEl=document.getElementById('log'),stakeValEl=document.getElementById('stakeVal'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.parentElement.offsetWidth*2;canvas.height=canvas.parentElement.offsetHeight*2;draw()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#112040';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,canvas.height*i/4);ctx.lineTo(canvas.width,canvas.height*i/4);ctx.stroke()}if(points.length<2)return;ctx.strokeStyle='#0a84ff';ctx.lineWidth=2.5;ctx.beginPath();points.forEach((p,i)=>{let x=i/points.length*canvas.width;let y=canvas.height*0.5+(Math.sin(i*0.3)+(p%10-5)/5)*30;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}function updatePrice(){price+=(Math.random()-0.5)*0.8;lastDigit=Math.floor(Math.random()*10);history.unshift(lastDigit);if(history.length>100)history.pop();priceEl.textContent=price.toFixed(2);badge.textContent='LAST '+lastDigit;lastEl.textContent='LAST '+lastDigit;let freq={};history.forEach(d=>freq[d]=(freq[d]||0)+1);let sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);if(sorted[0])hotEl.textContent='HOT '+sorted[0][0];if(sorted[sorted.length-1])coldEl.textContent='COLD '+sorted[sorted.length-1][0];evenCount=history.filter(d=>d%2==0).length;total=history.length||1;let evenP=Math.round(evenCount/total*100);evenPctEl.textContent='EVEN '+evenP+'%';oddPctEl.textContent=(100-evenP)+'% ODD';barEl.style.width=evenP+'%';points.push(price);if(points.length>80)points.shift();draw()}setInterval(updatePrice,800);resize();window.onresize=resize;function setStake(v){stake=v;stakeValEl.textContent='$'+v}function chgStake(d){stake=Math.max(1,stake+d);stakeValEl.textContent='$'+stake}function setMode(m){document.getElementById('autoBtn').className=m=='auto'?'act':'';document.getElementById('manBtn').className=m=='manual'?'act':'';if(m=='auto')startAuto();else stopAuto()}function startAuto(){if(autoRunning)return;autoRunning=true;log('AUTO STARTED - KQBinary');autoTimer=setInterval(()=>{let evenP=evenCount/total*100;let choice=evenP>52?'even':'odd';doTrade(choice,true)},2500)}function stopAuto(){autoRunning=false;clearInterval(autoTimer);log('AUTO STOPPED')}function trade(c){doTrade(c,false)}function doTrade(choice,isAuto){let win=(choice=='even'&&lastDigit%2==0)||(choice=='odd'&&lastDigit%2==1);let profit=win?stake*0.95:-stake;balance+=profit;balEl.textContent='R $ '+balance.toFixed(2);let row=document.createElement('div');row.style.color=win?'#00e676':'#ff5252';row.textContent=(isAuto?'[AUTO] ':'')+new Date().toLocaleTimeString()+' - '+choice.toUpperCase()+' @'+lastDigit+(win?' WIN +$'+(stake*0.95).toFixed(2):' LOSS -$'+stake);logEl.prepend(row);if(!win){stake=Math.min(stake*2,100)}else{stake=10}stakeValEl.textContent='$'+stake;if(balance>=200){log('TARGET $200 HIT');stopAuto()}}function log(t){let d=document.createElement('div');d.textContent=t;logEl.prepend(d)}</script></body></html>
