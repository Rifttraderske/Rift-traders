<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RT - RiftTraders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050a14;color:#fff;padding-bottom:80px}
.h{display:flex;justify-content:space-between;padding:10px;background:#0a1222;align-items:center;flex-wrap:wrap;gap:6px}
.logo{font-weight:900;display:flex;gap:6px;align-items:center}
.logo span{background:#00b4ff;color:#fff;width:32px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.a{display:flex;background:#111c33;border-radius:18px;border:1px solid #1e3a5f}
.a button{padding:5px 12px;border:none;font-size:12px;background:transparent;color:#888}
.a button.on{background:#00b4ff;color:#fff;border-radius:18px}
.a button.on.r{background:#00ff88;color:#000}
.bal{background:#111c33;padding:5px 12px;border-radius:18px;border:1px solid #1e3a5f;color:#8ab4ff;font-size:12px}
.dep{background:#00b4ff;color:#fff;padding:7px 14px;border-radius:8px;border:none;font-weight:bold}
.box{background:#0a1222;margin:8px;border-radius:12px;padding:10px;border:1px solid #1a2a4a}
#chart{width:100%;height:220px;background:#050a14;border-radius:8px;border:1px solid #102040}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.bar{height:30px;background:#111e36;border-radius:4px}
.bar.hot{background:#00b4ff}
.num{background:#0f1a2e;padding:6px 0;text-align:center;border-radius:6px;font-size:12px;color:#8ab4ff}
.num.on{background:#00b4ff;color:#fff}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.q{background:#0f1a2e;padding:8px;border-radius:8px;border:1px solid #1a2a4a;color:#8ab4ff;text-align:center}
.q.on{border-color:#00b4ff;color:#00b4ff}
.btn{padding:12px;border-radius:10px;background:#0a1222;border:1px solid #1e3a5f;margin:5px}
</style>
</head>
<body>
<div class="h">
<div class="logo"><span>RT</span>RiftTraders</div>
<div class="a"><button id="rb" onclick="setA('real')">REAL</button><button id="db" class="on" onclick="setA('demo')">DEMO</button></div>
<div class="bal">$<span id="bal">10000.00</span></div>
<button class="dep" onclick="dep()">Deposit</button>
</div>
<div class="box">
<b>Volatility 10 (1s) Index</b> <span id="pr" style="float:right;color:#00b4ff;border:1px solid #00b4ff;padding:3px 8px;border-radius:6px">9451.08</span>
<canvas id="chart"></canvas>
<div style="font-size:10px;color:#5a7ab0;margin-top:4px" id="feed">LIVE • DEMO</div>
</div>
<div class="box" style="display:flex;justify-content:space-between">
<div><div style="font-size:10px;color:#5a7ab0">AI • <span id="al">DEMO</span></div><b id="ai" style="color:#00b4ff;font-size:18px">EVEN</b><div style="font-size:10px" id="ac">55%</div></div>
<div style="text-align:right"><div>🤖</div><div id="ap" style="background:#102040;padding:2px 8px;border-radius:10px;border:1px solid #00b4ff;font-size:11px">55%</div></div>
</div>
<div class="box">
<div style="font-size:10px;color:#5a7ab0;display:flex;justify-content:space-between">EVEN/ODD REAL <span>HOT <span id="hot">-</span> COLD <span id="cold">-</span> LAST <span id="last">-</span></span></div>
<div class="grid" id="bars"></div>
<div class="grid" id="nums"></div>
</div>
<div class="box" style="text-align:center">STAKE • <span id="sa">DEMO</span><br><b style="font-size:22px">$<span id="st">10</span></b><div class="qs"><div class="q" onclick="setS(1,this)">$1</div><div class="q" onclick="setS(5,this)">$5</div><div class="q on" onclick="setS(10,this)">$10</div><div class="q" onclick="setS(25,this)">$25</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;padding:8px;gap:8px">
<div class="btn" onclick="tr('even')"><b style="color:#00b4ff">Even</b><span style="float:right" id="ep">$19.52</span><br><span style="font-size:9px;color:#5a7ab0" id="evp">50%</span></div>
<div class="btn" onclick="tr('odd')"><b style="color:#00b4ff">Odd</b><span style="float:right" id="op">$19.52</span><br><span style="font-size:9px;color:#5a7ab0" id="odp">50%</span></div>
</div>
<script>
let ticks=[],digits=[],price=9451.08,acct='demo',stake=10,demo=10000,real=0;
let can=document.getElementById('chart'),ctx=can.getContext('2d');
function setA(t){acct=t;document.getElementById('rb').className=t=='real'?'on r':'';document.getElementById('db').className=t=='demo'?'on':'';document.getElementById('bal').innerText=(t=='real'?real:demo).toFixed(2);document.getElementById('al').innerText=t.toUpperCase();document.getElementById('sa').innerText=t.toUpperCase();document.getElementById('feed').innerText='LIVE • '+t.toUpperCase();}
function setS(v,e){stake=v;document.getElementById('st').innerText=v;document.querySelectorAll('.q').forEach(q=>q.classList.remove('on'));e.classList.add('on');let p=(v*1.952).toFixed(2);document.getElementById('ep').innerText='$'+p;document.getElementById('op').innerText='$'+p;}
function draw(){can.width=can.offsetWidth*2;can.height=can.offsetHeight*2;if(ticks.length<2)return;ctx.clearRect(0,0,can.width,can.height);let mn=Math.min(...ticks),mx=Math.max(...ticks),rg=mx-mn||1;ctx.strokeStyle=acct=='real'?'#00ff88':'#00b4ff';ctx.lineWidth=2;ctx.beginPath();ticks.forEach((v,i)=>{let X=i/(ticks.length-1)*can.width;let Y=can.height-((v-mn)/rg*can.height*0.7+can.height*0.15);if(i==0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);});ctx.stroke();}
function upd(){if(digits.length<10)return;let c={};for(let i=0;i<10;i++)c[i]=0;digits.forEach(d=>c[d]++);let hot=Object.keys(c).reduce((a,b)=>c[a]>c[b]?a:b),0);let cold=Object.keys(c).reduce((a,b)=>c[a]<c[b]?a:b),0);let last=digits[digits.length-1];document.getElementById('hot').innerText=hot;document.getElementById('cold').innerText=cold;document.getElementById('last').innerText=last;let b=document.getElementById('bars'),n=document.getElementById('nums');b.innerHTML='';n.innerHTML='';let mc=Math.max(...Object.values(c));for(let i=0;i<10;i++){let h=(c[i]/mc*35+8);b.innerHTML+=`<div class="bar ${i==hot?'hot':''}" style="height:${h}px"></div>`;n.innerHTML+=`<div class="num ${i==last?'on':''}">${i}<br><span style="font-size:8px">${c[i]}</span></div>`;}let ev=digits.filter(d=>d%2==0).length,evp=Math.round(ev/digits.length*100),odp=100-evp;document.getElementById('evp').innerText=evp+'%';document.getElementById('odp').innerText=odp+'%';document.getElementById('ai').innerText=evp>odp?'EVEN':'ODD';document.getElementById('ap').innerText=Math.max(evp,odp)+'%';document.getElementById('ac').innerText=Math.max(evp,odp)+'% '+acct;}
for(let i=0;i<60;i++){ticks.push(price+Math.sin(i*0.3)*2);digits.push(Math.floor(Math.random()*10));}
draw();upd();
setInterval(()=>{price+=(Math.random()-0.5)*0.8;document.getElementById('pr').innerText=price.toFixed(2);ticks.push(price);if(ticks.length>80)ticks.shift();let d=Math.floor(Math.random()*10);digits.push(d);if(digits.length>40)digits.shift();draw();upd();},1000);
function tr(t){let b=acct=='real'?real:demo;if(b<stake){alert('Low '+acct+' balance!');return;}if(acct=='demo'){let w=Math.random()>0.5;if(w){demo+=stake*0.952;alert('DEMO WIN +$'+(stake*0.952).toFixed(2)+'\nNew: $'+demo.toFixed(2));}else{demo-=stake;alert('DEMO LOSS -$'+stake+'\nNew: $'+demo.toFixed(2));}document.getElementById('bal').innerText=demo.toFixed(2);}else{if(confirm('REAL TRADE '+t.toUpperCase()+' $'+stake+'\nGo to Deriv?'))window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank');}}
function dep(){if(acct=='demo'){demo=10000;document.getElementById('bal').innerText='10000.00';alert('Demo reset $10k');}else window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank');}
</script>
</body>
</html>
