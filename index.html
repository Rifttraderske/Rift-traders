body{background:#0b1220;color:#fff}
.header{background:#0f1c34;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1c2e55;position:sticky;top:0;z-index:99}

.title{font-weight:800;font-size:15px}

.delta{color:#ff4c5c;font-size:13px;font-weight:700}
