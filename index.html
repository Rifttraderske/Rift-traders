<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RT RiftTraders AI DEEP SCAN</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#050a14;color:#fff;padding-bottom:80px}.h{display:flex;justify-content:space-between;padding:10px;background:#0a1222;align-items:center;gap:6px;flex-wrap:wrap}.logo{font-weight:900;display:flex;gap:6px}.logo span{background:#00b4ff;width:32px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}.a{display:flex;background:#111c33;border-radius:18px;border:1px solid #1e3a5f}.a button{padding:5px 12px;border:none;background:transparent;color:#888;font-size:12px}.a button.on{background:#00b4ff;color:#fff;border-radius:18px}.a button.on.r{background:#00ff88;color:#000}.bal{background:#111c33;padding:5px 12px;border-radius:18px;border:1px solid #1e3a5f;color:#8ab4ff;font-size:12px}.box{background:#0a1222;margin:8px;border-radius:12px;padding:10px;border:1px solid #1a2a4a}#c{width:100%;height:220px;background:#050a14;border-radius:8px;border:1px solid #102040}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}.bar{height:30px;background:#111e36;border-radius:4px}.bar.hot{background:#00b4ff}.num{background:#0f1a2e;padding:6px 0;text-align:center;border-radius:6px;font-size:12px;color:#8ab4ff}.num.on{background:#00b4ff;color:#fff}.q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.q div{background:#0f1a2e;padding:8px;border-radius:8px;border:1px solid #1a2a4a;color:#8ab4ff;text-align:center}.q div.on{border-color:#00b4ff;color:#00b4ff}.btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.btn div{padding:12px;border-radius:10px;background:#0a1222;border:1px solid #1e3a5f}.scan{background:linear-gradient(135deg,#00b4ff,#0066ff);color:#fff;padding:10px;border-radius:10px;border:none;width:100%;font-weight:900;font-size:14px;cursor:pointer;animation:glow 2s infinite}.scan.scanning{background:linear-gradient(135deg,#ffaa00,#ff6600);animation:shake 0.2s infinite}@keyframes glow{0%,100%{box-shadow:0 0 10px #00b4ff}50%{box-shadow:0 0 20px #00b4ff}}@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}#deepBox{display:none;background:linear-gradient(135deg,#0a1222,#102040);border:2px solid #00b4ff;border-radius:12px;padding:12px;margin:8px}</style></head><body><div class="h"><div class="logo"><span>RT</span>RiftTraders</div><div class="a"><button id="rb" onclick="setA('real')">REAL</button><button id="db" class="on" onclick="setA('demo')">DEMO</button></div><div class="bal">$<span id="bl">10000.00</span></div><button onclick="dep()" style="background:#00b4ff;color:#fff;padding:7px 14px;border-radius:8px;border:none;font-weight:bold">Deposit</button></div><div class="box"><b>V10 (1s) LIVE</b><span id="pr" style="float:right;color:#00b4ff;border:1px solid #00b4ff;padding:3px 8px;border-radius:6px">9451.08</span><canvas id="c"></canvas><div style="font-size:10px;color:#5a7ab0;margin-top:4px" id="fd">LIVE DEMO • AI READY</div></div><div class="box" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:#5a7ab0">AI PREDICTION <span id="al">DEMO</span></div><b id="ai" style="color:#00b4ff;font-size:20px">ANALYZING...</b><div style="font-size:10px" id="ac">Click DEEP SCAN</div></div><div style="text-align:right"><div style="font-size:24px">🤖</div><div id="ap" style="background:#102040;padding:4px 10px;border-radius:12px;border:1px solid #00b4ff;font-size:12px;font-weight:bold">--%</div></div></div><div class="box"><button class="scan" id="scanBtn" onclick="deepScan()">🔍 AI DEEP SCAN - ANALYZE 100 TICKS</button><div id="deepBox"><div style="font-size:11px;color:#00b4ff;font-weight:bold">🧠 DEEP SCAN RESULT</div><div id="deepResult" style="margin-top:8px;font-size:12px;line-height:1.6"></div><div style="margin-top:8px;display:flex;gap:6px"><div style="flex:1;background:#111c33;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#5a7ab0">PATTERN</div><b id="pat" style="color:#00b4ff">-</b></div><div style="flex:1;background:#111c33;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#5a7ab0">STREAK</div><b id="str" style="color:#00ff88">-</b></div><div style="flex:1;background:#111c33;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#5a7ab0">CONFIDENCE</div><b id="conf" style="color:#ffaa00">-</b></div></div></div></div><div class="box"><div style="font-size:10px;color:#5a7ab0;display:flex;justify-content:space-between">EVEN/ODD REAL TIME<span>HOT <span id="hot">-</span> COLD <span id="cold">-</span> LAST <span id="lt">-</span></span></div><div class="g" id="bars"></div><div class="g" id="nums"></div></div><div class="box" style="text-align:center">STAKE <span id="sa">DEMO</span><br><b style="font-size:22px">$<span id="st">10</span></b><div class="q" id="qs"><div onclick="setS(1,this)">$1</div><div onclick="setS(5,this)">$5</div><div class="on" onclick="setS(10,this)">$10</div><div onclick="setS(25,this)">$25</div></div></div><div class="btn"><div onclick="tr('even')"><b style="color:#00b4ff">Even</b><span style="float:right" id="ep">$19.52</span><br><span style="font-size:9px;color:#5a7ab0" id="evp">50%</span></div><div onclick="tr('odd')"><b style="color:#00b4ff">Odd</b><span style="float:right" id="op">$19.52</span><br><span style="font-size:9px;color:#5a7ab0" id="odp">50%</span></div></div><script>let t=[],d=[],p=9451.08,ac='demo',sk=10,dm=10000,rl=0,cn=document.getElementById('c'),cx=cn.getContext('2d');function setA(x){ac=x;document.getElementById('rb').className=x=='real'?'on r':'';document.getElementById('db').className=x=='demo'?'on':'';document.getElementById('bl').innerText=(x=='real'?rl:dm).toFixed(2);document.getElementById('al').innerText=x.toUpperCase();document.getElementById('sa').innerText=x.toUpperCase();document.getElementById('fd').innerText='LIVE '+x.toUpperCase()+' • AI READY'}function setS(v,e){sk=v;document.getElementById('st').innerText=v;document.querySelectorAll('#qs div').forEach(q=>q.classList.remove('on'));e.classList.add('on');let k=(v*1.952).toFixed(2);document.getElementById('ep').innerText='$'+k;document.getElementById('op').innerText='$'+k}function dr(){cn.width=cn.offsetWidth*2;cn.height=cn.offsetHeight*2;if(t.length<2)return;cx.clearRect(0,0,cn.width,cn.height);let mn=Math.min(...t),mx=Math.max(...t),rg=mx-mn||1;cx.strokeStyle=ac=='real'?'#00ff88':'#00b4ff';cx.lineWidth=2;cx.beginPath();t.forEach((v,i)=>{let X=i/(t.length-1)*cn.width,Y=cn.height-((v-mn)/rg*cn.height*0.7+cn.height*0.15);if(i==0)cx.moveTo(X,Y);else cx.lineTo(X,Y)});cx.stroke()}function up(){if(d.length<10)return;let c={};for(let i=0;i<10;i++)c[i]=0;d.forEach(x=>c[x]++);let h=Object.keys(c).reduce((a,b)=>c[a]>c[b]?a:b),cl=Object.keys(c).reduce((a,b)=>c[a]<c[b]?a:b),ls=d[d.length-1];document.getElementById('hot').innerText=h;document.getElementById('cold').innerText=cl;document.getElementById('lt').innerText=ls;let b=document.getElementById('bars'),n=document.getElementById('nums');b.innerHTML='';n.innerHTML='';let mc=Math.max(...Object.values(c));for(let i=0;i<10;i++){let hh=(c[i]/mc*35+8);b.innerHTML+=`<div class="bar ${i==h?'hot':''}" style="height:${hh}px"></div>`;n.innerHTML+=`<div class="num ${i==ls?'on':''}">${i}<br><span style="font-size:8px">${c[i]}</span></div>`}let ev=d.filter(x=>x%2==0).length,evp=Math.round(ev/d.length*100),odp=100-evp;document.getElementById('evp').innerText=evp+'%';document.getElementById('odp').innerText=odp+'%';if(document.getElementById('deepBox').style.display=='none'){document.getElementById('ai').innerText=evp>odp?'EVEN':'ODD';document.getElementById('ap').innerText=Math.max(evp,odp)+'%';document.getElementById('ac').innerText=Math.max(evp,odp)+'% trend '+ac}}function deepScan(){let btn=document.getElementById('scanBtn'),box=document.getElementById('deepBox');btn.innerText='⚡ SCANNING 100 TICKS...';btn.classList.add('scanning');box.style.display='none';let steps=['Scanning tick history...','Analyzing Even/Odd patterns...','Detecting Hot/Cold cycles...','Calculating streak probability...','Finalizing AI prediction...'],i=0;let iv=setInterval(()=>{btn.innerText='🧠 '+steps[i];i++;if(i>=steps.length){clearInterval(iv);doScan();btn.innerText='🔍 AI DEEP SCAN - ANALYZE 100 TICKS';btn.classList.remove('scanning')}},400)}function doScan(){let box=document.getElementById('deepBox');box.style.display='block';let ev=d.filter(x=>x%2==0).length,od=d.length-ev,evp=Math.round(ev/d.length*100),odp=100-evp;let c={};for(let i=0;i<10;i++)c[i]=0;d.forEach(x=>c[x]++);let hot=Object.keys(c).reduce((a,b)=>c[a]>c[b]?a:b),cold=Object.keys(c).reduce((a,b)=>c[a]<c[b]?a:b);let last5=d.slice(-5),streak=1;for(let i=d.length-2;i>=0;i--){if((d[i]%2)==(d[d.length-1]%2))streak++;else break}let pred=evp>55?'EVEN':odp>55?'ODD':(Math.random()>0.5?'EVEN':'ODD');let conf=Math.max(evp,odp)+Math.floor(Math.random()*10);if(conf>92)conf=92;if(conf<58)conf=58;let pat=streak>=3?(streak+'x '+(d[d.length-1]%2==0?'EVEN':'ODD')+' streak'):evp>60?'EVEN dominance':odp>60?'ODD dominance':'Balanced market';document.getElementById('ai').innerText=pred;document.getElementById('ap').innerText=conf+'%';document.getElementById('ac').innerText='DEEP SCAN '+conf+'% '+ac;document.getElementById('pat').innerText=pat;document.getElementById('str').innerText=streak+'x';document.getElementById('conf').innerText=conf+'%';document.getElementById('deepResult').innerHTML=`✅ Last ${d.length} digits scanned<br>✅ Even: ${ev} (${evp}%) | Odd: ${od} (${odp}%)<br>✅ Hot: ${hot} (${c[hot]}x) | Cold: ${cold} (${c[cold]}x)<br>✅ Last 5: ${last5.join('-')}<br>🎯 <b style="color:${pred=='EVEN'?'#00b4ff':'#00ff88'}">AI RECOMMENDS: ${pred}</b> - ${conf}% confidence<br>💡 ${streak>=3?'Strong '+streak+'x streak detected - continuation likely':'No strong streak - follow dominant pattern'}`}for(let i=0;i<60;i++){t.push(p+Math.sin(i*0.3)*2);d.push(Math.floor(Math.random()*10))}dr();up();setInterval(()=>{p+=(Math.random()-0.5)*0.8;document.getElementById('pr').innerText=p.toFixed(2);t.push(p);if(t.length>80)t.shift();let x=Math.floor(Math.random()*10);d.push(x);if(d.length>40)d.shift();dr();up()},1000);function tr(x){let b=ac=='real'?rl:dm;if(b<sk){alert('Low '+ac+' balance!');return}if(ac=='demo'){let w=Math.random()>0.5;if(w){dm+=sk*0.952;alert('DEMO WIN +$'+(sk*0.952).toFixed(2)+'\n$'+dm.toFixed(2))}else{dm-=sk;alert('DEMO LOSS -$'+sk+'\n$'+dm.toFixed(2))}document.getElementById('bl').innerText=dm.toFixed(2)}else{if(confirm('REAL TRADE '+x.toUpperCase()+' $'+sk+'\nGo Deriv?'))window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank')}}function dep(){if(ac=='demo'){dm=10000;document.getElementById('bl').innerText='10000.00';alert('Demo $10k')}else window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank')}</script></body></html>
