tElementById('c'),cx=cn.getContext('2d');function setA(x){ac=x;document.getElementById('rb').className=x=='real'?'on r':'';document.getElementById('db').className=x=='demo'?'on':'';document.getElementById('bl').innerText=(x=='real'?rl:dm).toFixed(2);document.getElementById('al').innerText=x.toUpperCase();document.getElementById('sa').innerText=x.toUpperCase();document.getElementById('fd').innerText='LIVE '+x.toUpperCase()}function setS(v,e){sk=v;document.getElementById('st').innerText=v;document.querySelectorAll('#qs div').forEach(q=>q.classList.remove('on'));e.classList.add('on');let k=(v*1.952).toFixed(2);document.getElementById('ep').innerText='$'+k;document.getElementById('op').innerText='$'+k}function dr(){cn.width=cn.offsetWidth*2;cn.height=cn.offsetHeight*2;if(t.length<2)return;cx.clearRect(0,0,cn.width,cn.height);let mn=Math.min(...t),mx=Math.max(...t),rg=mx-mn||1;cx.strokeStyle=ac=='real'?'#00ff88':'#00b4ff';cx.lineWidth=2;cx.beginPath();t.forEach((v,i)=>{let X=i/(t.length-1)*cn.width,Y=cn.height-((v-mn)/rg*cn.height*0.7+cn.height*0.15);if(i==0)cx.moveTo(X,Y);else cx.lineTo(X,Y)});cx.stroke()}function up(){if(d.length<10)return;let c={};for(let i=0;i<10;i++)c[i]=0;d.forEach(x=>c[x]++);let h=Object.keys(c).reduce((a,b)=>c[a]>c[b]?a:b,0),cl=Object.keys(c).reduce((a,b)=>c[a]<c[b]?a:b,0),ls=d[d.length-1];document.getElementById('hot').innerText=h;document.getElementById('cold').innerText=cl;document.getElementById('lt').innerText=ls;let b=document.getElementById('bars'),n=document.getElementById('nums');b.innerHTML='';n.innerHTML='';let mc=Math.max(...Object.values(c));for(let i=0;i<10;i++){let hh=(c[i]/mc*35+8);b.innerHTML+=`<div class="bar ${i==h?'hot':''}" style="height:${hh}px"></div>`;n.innerHTML+=`<div class="num ${i==ls?'on':''}">${i}<br><span style="font-size:8px">${c[i]}</span></div>`}let ev=d.filter(x=>x%2==0).length,evp=Math.round(ev/d.length*100),odp=100-evp;document.getElementById('evp').innerText=evp+'%';document.getElementById('odp').innerText=odp+'%';document.getElementById('ai').innerText=evp>odp?'EVEN':'ODD';document.getElementById('ap').innerText=Math.max(evp,odp)+'%';document.getElementById('ac').innerText=Math.max(evp,odp)+'% '+ac}for(let i=0;i<60;i++){t.push(p+Math.sin(i*0.3)*2);d.push(Math.floor(Math.random()*10))}dr();up();setInterval(()=>{p+=(Math.random()-0.5)*0.8;document.getElementById('pr').innerText=p.toFixed(2);t.push(p);if(t.length>80)t.shift();let x=Math.floor(Math.random()*10);d.push(x);if(d.length>40)d.shift();dr();up()},1000);function tr(x){let b=ac=='real'?rl:dm;if(b<sk){alert('Low '+ac+' balance!');return}if(ac=='demo'){let w=Math.random()>0.5;if(w){dm+=sk*0.952;alert('DEMO WIN +$'+(sk*0.952).toFixed(2)+'\n$'+dm.toFixed(2))}else{dm-=sk;alert('DEMO LOSS -$'+sk+'\n$'+dm.toFixed(2))}document.getElementById('bl').innerText=dm.toFixed(2)}else{if(confirm('REAL TRADE '+x.toUpperCase()+' $'+sk+'\nGo Deriv?'))window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank')}}function dep(){if(ac=='demo'){dm=10000;document.getElementById('bl').innerText='10000.00';alert('Demo $10k')}else window.open('https://t.deriv.link?t=ZK9KPMJA37HC','_blank')}</script></body></html>
